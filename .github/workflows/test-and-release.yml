name: Test and release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run tests
        run: python -m unittest discover -s tests -v

  release:
    name: Create semver tag
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$({ git tag --list 'v*' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true; } | sort -V | tail -n 1)"
          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=1
            patch=0
          else
            version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            case "$BUMP" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported version increment: $BUMP" >&2
                exit 1
                ;;
            esac
          fi

          next_tag="v${major}.${minor}.${patch}"
          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Tag already exists: $next_tag" >&2
            exit 1
          fi

          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "Creating $next_tag"

      - name: Create and push tag
        env:
          NEXT_TAG: ${{ steps.version.outputs.next_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$NEXT_TAG" --message "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"
